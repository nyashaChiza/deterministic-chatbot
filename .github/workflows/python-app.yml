# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main", "production" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt --require-hashes
    - name: Audit dependencies for known vulnerabilities
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt --desc
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # style/complexity violations now fail the build too
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
    - name: Typecheck with mypy
      run: |
        mypy src/ main.py
    - name: Test with pytest
      run: |
        pytest

      env:
          # Real Twilio credentials, if any, are read from repo secrets. The
          # fallback values are obvious placeholders (USE_TWILIO=0 means they
          # are never used to call the real Twilio API in CI).
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID || 'test_account_sid' }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN || 'test_auth_token' }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER || '+15550000000' }}
          USE_TWILIO: 0
          BASE_URL: 'http://localhost:8000'
          RESET_PHRASE: 'reset'
          STATE_BACKEND: 'memory'
          DATABASE_URL: 'sqlite:///./state.db'